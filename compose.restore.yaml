services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: "${ALFA_DB_PASSWORD:?Set ALFA_DB_PASSWORD}"
      POSTGRES_DB: alfa_course
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - alfa_restore_data:/var/lib/postgresql/data
      - ./docs/source:/backup:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa_course"]
      interval: 2s
      timeout: 5s
      retries: 30

  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  alfa_restore_data: